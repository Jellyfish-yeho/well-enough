# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  # package-lock.json과 *.jar는 기본 제외 목록에 있다.
  path_filters:
    - "!backend/gradlew"
    - "!backend/gradlew.bat"
    - "!design/wireframes.html"
  path_instructions:
    - path: "frontend/**/*.{ts,tsx}"
      instructions: |
        - Next.js App Router와 TypeScript 코드다. `var`를 쓰지 않는다.
        - WCAG 2.2 AA: 키보드 조작, 보이는 포커스, 스크린리더용 이름을 확인한다.
        - 판정은 색만으로 전달하지 않고 텍스트와 아이콘을 함께 쓴다.
        - 판정과 플랜 계산은 서버가 한다. 프론트에서 다시 계산하지 않는다.
        - 화면 문구는 한국어·영어 번역 파일로 분리한다.
    - path: "frontend/**/*.css"
      instructions: |
        - 색, 간격, 둥글기는 design/tokens.css의 CSS 변수를 쓴다.
        - 라이트·다크 모드와 동작 줄이기 설정을 확인한다.
    - path: "backend/**/*.java"
      instructions: |
        - Spring Boot와 Java 25 코드다. 제안할 때 이유를 함께 설명한다.
        - 판정 경계값(149, 150, 300, 301분)과 IPAQ 정리 규칙(10분, 180분, 960분)의 테스트를 확인한다.
        - 입력 검증, 인증, 개인정보가 로그나 응답에 남지 않는지 확인한다.
    - path: ".github/workflows/**"
      instructions: |
        - 토큰 권한은 최소로 두고, 비밀값이 로그에 나오지 않는지 확인한다.
        - 작업 이름 frontend, backend는 필수 체크 이름이므로 바꾸지 않는다.

chat:
  auto_reply: true
